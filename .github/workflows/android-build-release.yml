name: Android Release Build & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup & Acceleration via Gradle Action
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Set Automatic Version Variables
        id: versioning
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Release APK (Parallel Accelerated)
        run: ./gradlew assembleRelease -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} -PversionName="${{ steps.versioning.outputs.VERSION_NAME }}" --build-cache --parallel

      - name: Prepare APK File
        run: cp app/build/outputs/apk/release/app-release.apk "Media-Encoder-${{ steps.versioning.outputs.VERSION_NAME }}.apk"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Media-Encoder-${{ steps.versioning.outputs.VERSION_NAME }}.apk"
          path: "Media-Encoder-${{ steps.versioning.outputs.VERSION_NAME }}.apk"

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.VERSION_NAME }}"
          name: "Media Encoder v${{ steps.versioning.outputs.VERSION_NAME }}"
          body: |
            🚀 **Official Release Build of Media Encoder App (v${{ steps.versioning.outputs.VERSION_NAME }})**
            
            - 🎥 **Video Codec Encoders**: HEVC (H.265), AVC (H.264), VP9, AV1, VP8, MPEG-4, H.263 via Hardware MediaCodec.
            - 🖼️ **Image Encoder**: WEBP, JPEG, PNG with quality & resizing controls.
            - 🎵 **Audio Encoder**: AAC, Opus, AMR-WB.
            - 📂 **Storage Destination**: External Public Movies & Internal App Storage.
            - 📱 **Native File Manager Integration**: Open With & Share support.
            - 📜 **Real-time System Logs**: Monospace Log Viewer & Copy to Clipboard.
          files: "Media-Encoder-${{ steps.versioning.outputs.VERSION_NAME }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
