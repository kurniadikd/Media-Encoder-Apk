name: Android Release Build & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK File
        run: cp app/build/outputs/apk/release/app-release.apk Media-Encoder-v1.0.0.apk

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media-Encoder-v1.0.0.apk
          path: Media-Encoder-v1.0.0.apk

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Media Encoder v1.0.0"
          body: |
            🚀 **Official Release Build of Media Encoder App**
            
            - 🎥 **Video Codec Encoders**: HEVC (H.265), AVC (H.264), VP9, AV1, VP8, MPEG-4, H.263 via Hardware MediaCodec.
            - 🖼️ **Image Encoder**: WEBP, JPEG, PNG with quality & resizing controls.
            - 🎵 **Audio Encoder**: AAC, Opus, AMR-WB.
            - 📂 **Storage Destination**: External Public Movies & Internal App Storage.
            - 📱 **Native File Manager Integration**: Open With & Share support.
          files: Media-Encoder-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
